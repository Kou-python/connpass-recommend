<!DOCTYPE html>
<html lang="ja" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>connpass おすすめイベント</title>
  <link rel="icon" type="image/png" href="icon.png" />
  <link rel="apple-touch-icon" href="icon.png" />
  <meta property="og:title" content="connpass おすすめイベント" />
  <meta property="og:description" content="connpass のおすすめイベントとトレンドワードをまとめて表示します。" />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="icon.png" />
  <meta name="twitter:card" content="summary" />
  <link rel="stylesheet" href="style.css" />
  <script src="theme.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="header-row">
      <h1>connpass おすすめイベント</h1>
      <nav class="site-nav">
        <a href="index.html" class="nav-link active">イベント</a>
        <a href="trends.html" class="nav-link">トレンド</a>
        <button id="theme-toggle" class="theme-toggle" aria-label="テーマ切り替え">☀</button>
        <button id="settings-toggle" class="theme-toggle" aria-label="設定">⚙</button>
      </nav>
    </div>
    <p class="updated">最終更新: <span id="updated-at">読み込み中...</span></p>
  </header>

  <nav class="filters" id="filters" aria-label="トレンドフィルタ">
    <!-- カテゴリチップは app.js が動的生成 -->
  </nav>

  <div class="sort-bar">
    <label for="sort-select" class="sort-label">並び順:</label>
    <select id="sort-select" class="sort-select">
      <option value="popular">人気順</option>
      <option value="new">新しい順</option>
    </select>
  </div>

  <main>
    <section id="event-grid" class="event-grid" aria-live="polite">
      <p class="status">イベントを読み込んでいます...</p>
    </section>
  </main>

  <footer class="site-footer">
    <p>
      データ提供: <a href="https://connpass.com/" target="_blank" rel="noopener">connpass</a>
    </p>
  </footer>

  <!-- 設定モーダル -->
  <div id="settings-modal" class="modal-overlay" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-header">
        <h2 id="modal-title">設定</h2>
        <button id="settings-close" class="modal-close" aria-label="閉じる">✕</button>
      </div>
      <div class="modal-body">
        <label class="setting-label" for="setting-username">
          connpass ユーザー名
          <span class="setting-hint">参加済みイベントを下段に移動するために使用します</span>
        </label>
        <input id="setting-username" type="text" class="setting-input"
               placeholder="例: kariiho" autocomplete="off" />

        <label class="setting-label" for="setting-repo">
          GitHub リポジトリ (owner/repo)
          <span class="setting-hint">「今すぐ更新」ボタンで使用します</span>
        </label>
        <input id="setting-repo" type="text" class="setting-input"
               placeholder="例: kou-python/connpass-recommend" autocomplete="off" />

        <label class="setting-label" for="setting-pat">
          GitHub Personal Access Token
          <span class="setting-hint">workflow スコープが必要です。localStorage に保存されます</span>
        </label>
        <input id="setting-pat" type="password" class="setting-input"
               placeholder="github_pat_..." autocomplete="off" />
      </div>
      <div class="modal-footer">
        <button id="settings-save" class="btn-primary">保存</button>
        <button id="settings-dispatch" class="btn-secondary">今すぐ更新</button>
      </div>
      <p id="settings-status" class="settings-status" aria-live="polite" hidden></p>
    </div>
  </div>

  <script src="settings.js" defer></script>
  <script src="app.js" defer></script>
  <canvas id="cursor-fx" aria-hidden="true"></canvas>
  <script src="cursor-fx.js" defer></script>
</body>
</html>
